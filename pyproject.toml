[project]
name = "prismal-webchat"
version = "0.1.0"
description = "Embeddable web chat (Reflex BFF) for the prismal ecosystem"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
requires-python = ">=3.11"
keywords = ["prismal", "chat", "widget", "reflex", "agents", "ag-ui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]
# Pins are deliberate (SPEC-WCB-NFR-005, DELTA-2026-10, DELTA-2026-11, DELTA-2026-11-pypi);
# tests/unit/test_dependencies.py fails on drift.
dependencies = [
    "reflex>=0.10,<0.11",
    "reflex-silverpoint-react>=0.9.1,<0.10",
    # prismal-sdk is published on PyPI as prismal-ai-sdk (import: prismal_sdk).
    "prismal-ai-sdk>=0.3,<1",
    "pydantic-settings>=2.5,<3",
]

[project.urls]
Homepage = "https://github.com/prismal-ai/prismal-webchat"
Source = "https://github.com/prismal-ai/prismal-webchat"
Changelog = "https://github.com/prismal-ai/prismal-webchat/blob/main/CHANGELOG.md"
Issues = "https://github.com/prismal-ai/prismal-webchat/issues"

[project.scripts]
prismal-webchat = "prismal_webchat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prismal_webchat"]

[tool.hatch.build.targets.wheel.force-include]
# Reflex runs from a working directory, not from site-packages: the console
# script copies these out (`prismal-webchat init|run`, SPEC-WCB-REL-002).
"rxconfig.py" = "prismal_webchat/_app/rxconfig.py"
"assets/embed.js" = "prismal_webchat/_app/assets/embed.js"
"reflex.lock/package.json" = "prismal_webchat/_app/reflex.lock/package.json"
"reflex.lock/bun.lock" = "prismal_webchat/_app/reflex.lock/bun.lock"

[tool.hatch.build.targets.sdist]
include = [
    "prismal_webchat",
    "assets/embed.js",
    "reflex.lock",
    "rxconfig.py",
    "scripts/smoke_test.py",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "packaging>=24",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "contract: opt-in tests against a live prismal-server",
    "compile: opt-in tests that compile the Reflex frontend",
]
addopts = "-m 'not contract and not compile'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".web", ".states"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# rx.State var defaults are copied per instance by Reflex, not shared.
"prismal_webchat/state/*.py" = ["RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["^\\.web/", "^tests/"]

[[tool.mypy.overrides]]
# Reflex element builders (rx.el.*, rx.cond, …) are typed as returning Any.
module = ["prismal_webchat.components.*", "prismal_webchat.webchat"]
warn_return_any = false

[[tool.mypy.overrides]]
# Ships .pyi stubs but no py.typed marker.
module = ["reflex_silverpoint_react", "reflex_silverpoint_react.*"]
follow_untyped_imports = true
