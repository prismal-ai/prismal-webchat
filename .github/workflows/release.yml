# WCB-04-06 — release prismal-webchat from `main`.
#
# The webchat is a deployable app, not a library (ARCHITECTURE §8): a release
# is a container image on GHCR plus a `v<version>` tag and GitHub release.
# Nothing is uploaded to PyPI.
#
# Every push to `main` (in practice: merging a release PR) runs this workflow.
# It ships the version in pyproject.toml when that version is a final release
# and has no tag yet; anything else (a `.devN` version, an existing tag) ends
# green without publishing, so re-runs are harmless.
#
# Privileges are split per job:
#   plan            contents: read                 — decide whether this version ships
#   verify          contents: read                 — gates + image build + smoke test
#   image           contents: read, packages: write — build and push ghcr.io/<repo>
#   github-release  contents: write                — tag + GitHub release after the push
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Decide whether this version ships
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(uv version --short)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # PEP 440 final releases only: no .devN / aN / bN / rcN / +local.
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*(\.post[0-9]+)?$ ]]; then
            echo "::notice::${version} is not a final release; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" >/dev/null 2>&1; then
            echo "::notice::v${version} is already tagged; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -q "^## \[${version}\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no [${version}] entry"; exit 1; }
          echo "publish=true" >> "$GITHUB_OUTPUT"

  verify:
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        run: uv run mypy prismal_webchat
      - name: Pytest (unit, offline)
        run: uv run pytest --cov=prismal_webchat --cov-report=term-missing
      - name: Pytest (compile)
        run: uv run pytest -m compile -v
      - name: Build image
        run: docker build -t "prismal-webchat:${VERSION}" .
      - name: Smoke test image
        run: scripts/docker_smoke.sh "prismal-webchat:${VERSION}"
      - name: Release notes (this version's CHANGELOG section)
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > release-notes.md
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '\nImage: `%s:%s`\n' "$image" "$VERSION" >> release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  image:
    needs: [plan, verify]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push ghcr.io/<owner>/prismal-webchat — nothing else
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build, tag and push
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${image}:${VERSION}" -t "${image}:latest" .
          docker push "${image}:${VERSION}"
          docker push "${image}:latest"

  github-release:
    needs: [plan, image]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the `v<version>` tag and the GitHub release
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "prismal-webchat ${VERSION}" \
            --notes-file release-notes.md
