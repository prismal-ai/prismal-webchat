# WCB-04-06 / SPEC-WCB-REL-001 — release prismal-webchat from `main`.
#
# A release is: the wheel + sdist on PyPI (`prismal-webchat`, with the
# `prismal-webchat` console script), the container image on GHCR, and a
# `v<version>` tag + GitHub release with the artifacts attached.
#
# Every push to `main` (in practice: merging a release PR) runs this workflow.
# It ships the version in pyproject.toml when that version is a final release
# and is not fully released yet. The steps are resumable: a version already
# on PyPI but without a `v<version>` tag (e.g. the image push failed) skips the
# upload and finishes the image + tag + GitHub release, attaching the exact
# files PyPI holds. A `.devN` version, or one on PyPI and tagged, ends green
# without publishing, so re-runs are harmless.
#
# Privileges are split per job:
#   plan            contents: read                  — decide whether this version ships
#   build           contents: read, actions: read   — gates, build, smoke tests → artifacts
#   pypi-publish    id-token: write                 — no checkout, no deps: upload artifacts
#   image           contents: read, packages: write — build and push ghcr.io/<repo>
#   github-release  contents: write                 — tag + GitHub release
# Every job runs only on refs/heads/main, and the `pypi` environment only
# accepts deployments from `main`.
#
# PyPI uses trusted publishing (OIDC): no token is stored in the repository.
# PyPI must list this publisher once — project `prismal-webchat`, owner
# `prismal-ai`, repository `prismal-webchat`, workflow `release.yml`,
# environment `pypi` (a "pending publisher" until the project exists).
#
# GHCR uses the job's GITHUB_TOKEN. The image carries
# `org.opencontainers.image.source`, which links the package to this
# repository on first push, so later pushes are authorized by the repository.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
      pypi: ${{ steps.decide.outputs.pypi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Decide whether this version ships
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(uv version --short)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # PEP 440 final releases only: no .devN / aN / bN / rcN / +local.
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*(\.post[0-9]+)?$ ]]; then
            echo "::notice::${version} is not a final release; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/prismal-webchat/${version}/json")"
          case "$status" in
            200) on_pypi=true ;;
            404) on_pypi=false ;;
            *) echo "::error::PyPI answered ${status} for prismal-webchat ${version}"; exit 1 ;;
          esac
          tagged=false
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${version}" >/dev/null 2>&1; then
            tagged=true
          fi
          if $on_pypi && $tagged; then
            echo "::notice::prismal-webchat ${version} is released; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PyPI uploads are immutable: a tag pointing elsewhere would describe
          # a different artifact.
          if $tagged; then
            echo "::error::tag v${version} already exists but ${version} is not on PyPI"
            exit 1
          fi
          grep -q "^## \[${version}\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no [${version}] entry"; exit 1; }
          if $on_pypi; then
            echo "::notice::${version} is on PyPI but untagged; resuming image + release"
            echo "pypi=false" >> "$GITHUB_OUTPUT"
          else
            echo "pypi=true" >> "$GITHUB_OUTPUT"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # resume path: download an earlier run's `dist` artifact
    env:
      EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        run: uv run mypy prismal_webchat
      - name: Pytest (unit, offline)
        run: uv run pytest --cov=prismal_webchat --cov-report=term-missing
      - name: Pytest (compile)
        run: uv run pytest -m compile -v
      - name: Build
        run: uv build
      # Resuming after the upload: release the bytes PyPI holds, never a
      # rebuild (builds are not byte-reproducible across runners). They are
      # trusted only if they are exactly the `dist` artifact an earlier run
      # of this workflow built: every PyPI sha256 must match that artifact.
      - name: Use this workflow's earlier, PyPI-verified artifacts
        if: needs.plan.outputs.pypi != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS "https://pypi.org/pypi/prismal-webchat/${EXPECTED_VERSION}/json" \
            | python3 -c 'import json,sys; [print(u["digests"]["sha256"], u["filename"]) for u in json.load(sys.stdin)["urls"]]' \
            | sort > "$RUNNER_TEMP/pypi.sha256"
          test -s "$RUNNER_TEMP/pypi.sha256" || { echo "::error::PyPI lists no files"; exit 1; }
          for run in $(gh run list -R "$GITHUB_REPOSITORY" -w release.yml -b main \
                         --status completed -L 30 --json databaseId --jq '.[].databaseId'); do
            [ "$run" = "$GITHUB_RUN_ID" ] && continue
            rm -rf "$RUNNER_TEMP/cand" && mkdir -p "$RUNNER_TEMP/cand"
            gh run download "$run" -R "$GITHUB_REPOSITORY" -n dist -D "$RUNNER_TEMP/cand" 2>/dev/null || continue
            (cd "$RUNNER_TEMP/cand" && sha256sum -- * | awk '{print $1, $2}' | sort) > "$RUNNER_TEMP/cand.sha256"
            if cmp -s "$RUNNER_TEMP/pypi.sha256" "$RUNNER_TEMP/cand.sha256"; then
              echo "PyPI files match the dist artifact of run ${run}"
              rm -rf dist && mv "$RUNNER_TEMP/cand" dist
              ls -l dist
              exit 0
            fi
          done
          echo "::error::no earlier release run's dist artifact matches PyPI's sha256 digests; not resuming"
          cat "$RUNNER_TEMP/pypi.sha256"
          exit 1
      # Catches what the suite cannot: files missing from the artifacts.
      - name: Smoke test (wheel, with reflex compile)
        run: |
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --python 3.13 \
            --with "$GITHUB_WORKSPACE"/dist/*.whl "$GITHUB_WORKSPACE/scripts/smoke_test.py" --compile
      - name: Smoke test (source distribution)
        run: |
          cd "$RUNNER_TEMP"
          uv run --isolated --no-project --python 3.13 \
            --with "$GITHUB_WORKSPACE"/dist/*.tar.gz "$GITHUB_WORKSPACE/scripts/smoke_test.py"
      - name: Build image
        run: docker build -t "prismal-webchat:${EXPECTED_VERSION}" .
      - name: Smoke test image
        run: scripts/docker_smoke.sh "prismal-webchat:${EXPECTED_VERSION}"
      - name: Release notes (this version's CHANGELOG section)
        run: |
          set -euo pipefail
          awk -v v="$EXPECTED_VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > release-notes.md
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo ""
            echo "PyPI: https://pypi.org/project/prismal-webchat/${EXPECTED_VERSION}/"
            printf 'Image: `%s:%s`\n' "$image" "$EXPECTED_VERSION"
          } >> release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  pypi-publish:
    needs: [plan, build]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/prismal-webchat/${{ needs.plan.outputs.version }}/
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing — nothing else
    steps:
      # No checkout and no dependency install: only the built artifacts and
      # uv itself ever run next to the OIDC token.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Publish to PyPI (trusted publishing)
        run: uv publish --trusted-publishing always dist/*

  image:
    needs: [plan, build, pypi-publish]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.plan.outputs.publish == 'true' && needs.build.result == 'success' &&
      (needs.pypi-publish.result == 'success' || needs.pypi-publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push ghcr.io/<owner>/prismal-webchat — nothing else
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # Same toolchain as prismal-server's release, which pushes to this org.
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          # A single-platform image manifest: no attestation index.
          provenance: false
          sbom: false
          tags: |
            ${{ steps.name.outputs.image }}:${{ env.VERSION }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Embeddable prismal web chat (Reflex BFF)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

  github-release:
    needs: [plan, image]
    if: always() && github.ref == 'refs/heads/main' && needs.image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the `v<version>` tag and the GitHub release
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "prismal-webchat ${VERSION}" \
            --notes-file release-notes.md
